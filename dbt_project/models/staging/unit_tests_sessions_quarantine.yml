  - name: positive_boundary_heart_rate_lower_valid
    description: "avg_heart_rate = 30 is the inclusive lower boundary -> not quarantined."
    model: stg_sessions_quarantine
    given:
      - input: ref('stg_sessions')
        rows:
          - <<: *valid_row
            avg_heart_rate: 30
      - input: ref('stg_athletes_clean')
        rows:
          - *known_athlete
    expect:
      rows: []

  - name: negative_out_of_range_heart_rate_above_range
    description: "avg_heart_rate = 221 is above the valid [30, 220] range -> OUT_OF_RANGE_HEART_RATE."
    model: stg_sessions_quarantine
    given:
      - input: ref('stg_sessions')
        rows:
          - <<: *valid_row
            avg_heart_rate: 221
      - input: ref('stg_athletes_clean')
        rows:
          - *known_athlete
    expect:
