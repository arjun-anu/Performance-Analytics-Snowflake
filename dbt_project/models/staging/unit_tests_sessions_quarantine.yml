        - failure_reason: OUT_OF_RANGE_HEART_RATE

  - name: positive_boundary_heart_rate_upper_valid
    description: "avg_heart_rate = 220 is the inclusive upper boundary -> not quarantined."
    model: stg_sessions_quarantine
    given:
      - input: ref('stg_sessions')
        rows:
          - <<: *valid_row
            avg_heart_rate: 220
      - input: ref('stg_athletes_clean')
        rows:
          - *known_athlete
    expect:
      rows: []

  # --- max_velocity: valid range is [0, 40] ---------------------------------

  - name: negative_missing_max_velocity
    description: "A null max_velocity is quarantined as MISSING_MAX_VELOCITY."
    model: stg_sessions_quarantine
    given:
      - input: ref('stg_sessions')
        rows:
          - <<: *valid_row
            max_velocity: null
      - input: ref('stg_athletes_clean')
        rows:
          - *known_athlete
    expect:
      rows:
        - failure_reason: MISSING_MAX_VELOCITY

  - name: negative_out_of_range_max_velocity_above_range
    description: "max_velocity = 41 is above the valid [0, 40] range -> OUT_OF_RANGE_MAX_VELOCITY."
    model: stg_sessions_quarantine
    given:
      - input: ref('stg_sessions')
        rows:
          - <<: *valid_row
            max_velocity: 41
      - input: ref('stg_athletes_clean')
        rows:
